<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oscilloscope Visualizer</title>
<style>
/* ---------------------------------------------------------------
   Korg MS-10 inspired panel: warm wood end cheeks, dark charcoal
   control surface, burnt-orange accent, cream silkscreen labels.
   --------------------------------------------------------------- */
:root {
  --wood-dark: #3a2513;
  --wood-mid: #6b4526;
  --wood-light: #8a5c34;
  --panel: #29271f;
  --panel-card: #34312a;
  --panel-border: #5a5346;
  --ink: #e3dac4;
  --ink-dim: #a89f8a;
  --orange: #e35a26;
  --orange-bright: #ff7a3d;
  --knob: #17140f;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: var(--ink);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: auto;
}

#app {
  width: 1928px;
  height: 1028px;
  display: flex;
  padding: 14px;
  background:
    repeating-linear-gradient(100deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 5px),
    linear-gradient(90deg, var(--wood-dark), var(--wood-light) 12%, var(--wood-mid) 50%, var(--wood-light) 88%, var(--wood-dark));
}

#stage {
  width: 1000px;
  height: 1000px;
  flex: 0 0 1000px;
  background: #000;
  border: 3px solid var(--knob);
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px #000, 0 0 0 1px rgba(0,0,0,0.5);
  margin-right: 14px;
}

#scope {
  width: 1000px;
  height: 1000px;
  display: block;
  background: #000;
}

#panel {
  flex: 1 1 auto;
  width: 900px;
  height: 1000px;
  overflow-y: auto;
  background: var(--panel);
  border: 3px solid var(--knob);
  border-radius: 3px;
  padding: 14px 18px 40px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  align-content: start;
}

#panel::-webkit-scrollbar { width: 10px; }
#panel::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 6px; }
#panel::-webkit-scrollbar-track { background: var(--panel); }

.panel-header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--panel-border);
}

.panel-header h1 {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--orange-bright);
  text-shadow: 0 1px 0 rgba(0,0,0,0.6);
  margin: 0;
}

.header-actions { display: flex; gap: 8px; }

button {
  font-family: inherit;
  cursor: pointer;
  border: 1px solid #000;
  background: linear-gradient(#403c34, #2a271f);
  color: var(--ink);
  border-radius: 4px;
  padding: 7px 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.6);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}

button:hover { background: linear-gradient(#4a463c, #322e25); }

.wide-btn {
  background: linear-gradient(#403c34, #2a271f);
  border-color: #000;
  color: var(--ink);
}
.wide-btn:hover { background: linear-gradient(#4a463c, #322e25); }
.wide-btn.active {
  background: linear-gradient(var(--orange-bright), var(--orange));
  border-color: #000;
  color: #1a0d04;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 6px rgba(227,90,38,0.6);
}
.wide-btn.ghost {
  background: #221f19;
  color: var(--ink-dim);
  border-color: #000;
  font-weight: 700;
}
.wide-btn.ghost:hover { color: var(--ink); }

/* Grid layout: every fieldset is its own card; the .section wrapper
   divs (compactParams/toneGroup/displayParams) go transparent so
   their child fieldsets act as direct grid items. */
.section {
  display: contents;
}

fieldset.group {
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  margin: 0;
  height: fit-content;
  padding: 10px 14px 14px;
  background: var(--panel-card);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 3px rgba(0,0,0,0.4);
}

fieldset.group legend {
  padding: 0 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--orange-bright);
}

.param-block {
  border-color: var(--panel-border);
}

.param-block legend {
  color: var(--orange-bright);
}

.subhead {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-dim);
  margin: 10px 0 4px;
  border-top: 1px solid var(--panel-border);
  padding-top: 6px;
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 5px 0;
}

.row label {
  flex: 0 0 96px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.row input[type="range"] {
  flex: 1 1 auto;
  height: 3px;
  border-radius: 2px;
  background: #171510;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  accent-color: var(--orange);
  appearance: none;
  -webkit-appearance: none;
}

.row input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  background: #171510;
  border-radius: 2px;
}

.row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -6.5px;
  border-radius: 50%;
  background:
    linear-gradient(var(--ink) 0 100%) center 2px / 2px 5px no-repeat,
    radial-gradient(circle at 35% 30%, #3a382f, var(--knob) 75%);
  border: 1px solid #000;
  box-shadow: 0 0 0 2px rgba(227,90,38,0.55), 0 1px 2px rgba(0,0,0,0.7);
  cursor: pointer;
}

.row input[type="range"]::-moz-range-track {
  height: 3px;
  background: #171510;
  border-radius: 2px;
}

.row input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #3a382f, var(--knob) 75%);
  border: 1px solid #000;
  box-shadow: 0 0 0 2px rgba(227,90,38,0.55);
  cursor: pointer;
}

.row select,
.row input[type="file"] {
  flex: 1 1 auto;
  background: #171510;
  color: var(--ink);
  border: 1px solid #000;
  border-radius: 3px;
  padding: 4px 6px;
  font-size: 12px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.7);
}

.readout {
  flex: 0 0 46px;
  text-align: right;
  font-size: 11px;
  font-weight: 700;
  color: var(--orange-bright);
  font-variant-numeric: tabular-nums;
}

.checks {
  gap: 16px;
}

.check {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
}

.check input { accent-color: var(--orange); }

.hint {
  font-size: 12px;
  color: var(--ink-dim);
  font-style: italic;
}

.preset-actions button {
  flex: 1 1 0;
}

.preset-list {
  margin-top: 8px;
  max-height: 220px;
  overflow-y: auto;
  border: 1px solid var(--panel-border);
  border-radius: 3px;
  background: #171510;
}

.preset-list::-webkit-scrollbar { width: 8px; }
.preset-list::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 6px; }
.preset-list::-webkit-scrollbar-track { background: #171510; }

.preset-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  border-bottom: 1px solid var(--panel-border);
  cursor: pointer;
}
.preset-item:last-child { border-bottom: none; }
.preset-item:hover { background: #221f19; }

.preset-item .preset-name {
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preset-item .preset-name-input {
  flex: 1 1 auto;
  background: #0c0a07;
  color: var(--ink);
  border: 1px solid var(--orange);
  border-radius: 2px;
  font: inherit;
  padding: 2px 4px;
}

.preset-item .preset-delete {
  flex: none;
  border: none;
  background: transparent;
  color: var(--ink-dim);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  padding: 0 2px;
  box-shadow: none;
}
.preset-item .preset-delete:hover { color: var(--orange-bright); }

.preset-empty {
  padding: 10px;
  font-size: 11px;
  font-style: italic;
  color: var(--ink-dim);
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="scope" width="1000" height="1000"></canvas>
  </div>

  <div id="panel">
    <div class="panel-header">
      <h1>Oscilloscope Visualizer</h1>
      <div class="header-actions">
        <button id="muteBtn" class="wide-btn ghost">Mute Tone</button>
        <button id="pauseBtn" class="wide-btn ghost">Pause Signal</button>
        <button id="freezeBtn" class="wide-btn">Freeze</button>
        <button id="resetBtn" class="wide-btn ghost">Reset</button>
      </div>
    </div>

    <fieldset class="group" id="sourceDisplaySection">
      <legend>Source &amp; Display</legend>
      <div class="row">
        <label for="sourceSelect">Input</label>
        <select id="sourceSelect">
          <option value="tone" selected>Test Tone</option>
          <option value="mic">Microphone</option>
          <option value="lineout">Line Out</option>
          <option value="file">Audio File</option>
        </select>
      </div>
      <div class="row" id="fileRow" hidden>
        <label for="fileInput">File</label>
        <input type="file" id="fileInput" accept="audio/*">
      </div>
      <div class="row" id="liveStatusRow" hidden>
        <span id="liveStatus" class="hint">Requesting access...</span>
      </div>
      <div class="row">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option value="waveform">Waveform</option>
          <option value="xy" selected>XY (Lissajous)</option>
        </select>
      </div>
      <div class="row checks">
        <label class="check"><input type="checkbox" id="showGrid" checked> Grid</label>
        <label class="check"><input type="checkbox" id="glow" checked> Glow</label>
      </div>
    </fieldset>

    <fieldset class="group" id="presetsSection">
      <legend>Presets</legend>
      <div class="row preset-actions">
        <button id="savePresetBtn" class="wide-btn ghost" type="button">Save</button>
        <button id="randomizeBtn" class="wide-btn ghost" type="button">Randomize</button>
      </div>
      <div id="presetList" class="preset-list"></div>
    </fieldset>

    <div id="compactParams" class="section"></div>

    <div id="toneGroup" class="section"></div>

    <div id="displayParams" class="section"></div>
  </div>
</div>
<script>
'use strict';

const canvas = document.getElementById('scope');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const FFT_SIZE = 2048;

const els = {
  sourceSelect: document.getElementById('sourceSelect'),
  fileRow: document.getElementById('fileRow'),
  fileInput: document.getElementById('fileInput'),
  liveStatusRow: document.getElementById('liveStatusRow'),
  liveStatus: document.getElementById('liveStatus'),
  toneGroup: document.getElementById('toneGroup'),
  displayParams: document.getElementById('displayParams'),
  compactParams: document.getElementById('compactParams'),
  modeSelect: document.getElementById('modeSelect'),
  showGrid: document.getElementById('showGrid'),
  glow: document.getElementById('glow'),
  muteBtn: document.getElementById('muteBtn'),
  pauseBtn: document.getElementById('pauseBtn'),
  freezeBtn: document.getElementById('freezeBtn'),
  resetBtn: document.getElementById('resetBtn'),
  savePresetBtn: document.getElementById('savePresetBtn'),
  randomizeBtn: document.getElementById('randomizeBtn'),
  presetList: document.getElementById('presetList'),
};

const DEFAULTS = { source: 'tone', mode: 'xy', showGrid: true, glow: true };
const display = { ...DEFAULTS };
let frozen = false;

// Mute Tone silences only the sink feeding the speakers - the analysers
// tap the signal upstream of it, so the visualization keeps running.
const TONE_AUDIBLE_GAIN = 0.2;
let toneMuted = false;

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Only unlocks autoplay on the very first interaction - must not keep
// firing, or it would silently undo a deliberate Pause Signal click.
document.addEventListener('pointerdown', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

// Rotation only makes sense on the Waveform trace (XY mode is its own
// 2D shape already), so its card is shown/hidden alongside the tone
// channel cards depending on source/mode.
let rotationFieldset = null;

function updateVisibility() {
  els.toneGroup.style.display = els.sourceSelect.value === 'tone' ? '' : 'none';
  if (rotationFieldset) rotationFieldset.style.display = els.modeSelect.value === 'waveform' ? '' : 'none';
}

// Holding Shift when a drag STARTS switches that whole drag to fine
// adjustment (10% sensitivity) instead of the native jump-to-cursor
// behavior. The modifier is only checked at drag-start, since a native
// range input's own pointer handling can't be toggled mid-drag.
const FINE_DRAG_FACTOR = 0.1;

function enableFineDrag(el) {
  el.addEventListener('pointerdown', (e) => {
    if (!e.shiftKey) return;
    e.preventDefault();

    const min = parseFloat(el.min);
    const max = parseFloat(el.max);
    const range = max - min;
    const step = parseFloat(el.step) || range / 100;
    const rect = el.getBoundingClientRect();
    const startX = e.clientX;
    const startValue = parseFloat(el.value);
    el.setPointerCapture(e.pointerId);

    const onMove = (ev) => {
      const dxRatio = (ev.clientX - startX) / rect.width;
      let v = startValue + dxRatio * range * FINE_DRAG_FACTOR;
      v = Math.min(max, Math.max(min, v));
      v = Math.round(v / step) * step;
      el.value = v;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    };
    const onUp = (ev) => {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      try { el.releasePointerCapture(ev.pointerId); } catch (err) { /* already released */ }
    };
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
  });
}

// ---------------------------------------------------------------
// Animated parameters: every numeric control gets a base value plus
// an LFO wobble on top. LFO Amount always allows fractional values -
// the amount step is 0.1 or finer for every parameter, and its
// readout always shows at least one decimal place regardless of how
// the base value itself is displayed.
// ---------------------------------------------------------------
const WAVE_OPTIONS = ['sine', 'triangle', 'sawtooth', 'square'];
const LFO_SPEED_MAX = 0.5;

function lfoDigits(def) { return def.digits === 0 ? 1 : def.digits; }

// X/Y test-tone channels: each has its own Wave type plus a Frequency,
// a Phase, and a Gain, all three with their own LFO. Phase is implemented
// via a DelayNode (see setupTone) since OscillatorNode has no live-
// adjustable phase param. Frequency's LFO is labeled "Pitch LFO" now that
// each channel has more than one LFO, to keep them unambiguous.
const channelDefs = [
  { chanKey: 'X', label: 'X Channel', waveKey: 'waveX',
    freq: { key: 'freqX', label: 'X Freq', min: 20, max: 500, def: 220, step: 1, digits: 0,
      lfoAmountMax: 15, lfoAmountStep: 0.1, lfoLabel: 'Pitch LFO' },
    phase: { key: 'phaseX', label: 'X Phase', min: 0, max: 360, def: 0, step: 1, digits: 0,
      lfoAmountMax: 360, lfoAmountStep: 0.1 },
    gain: { key: 'oscGainX', label: 'Gain', min: 0.1, max: 1.25, def: 1, step: 0.01, digits: 2,
      lfoAmountMax: 0.1, lfoAmountStep: 0.01 } },
  { chanKey: 'Y', label: 'Y Channel', waveKey: 'waveY',
    freq: { key: 'freqY', label: 'Y Freq', min: 20, max: 500, def: 330, step: 1, digits: 0,
      lfoAmountMax: 15, lfoAmountStep: 0.1, lfoLabel: 'Pitch LFO' },
    phase: { key: 'phaseY', label: 'Y Phase', min: 0, max: 360, def: 0, step: 1, digits: 0,
      lfoAmountMax: 360, lfoAmountStep: 0.1 },
    gain: { key: 'oscGainY', label: 'Gain', min: 0.1, max: 1.25, def: 1, step: 0.01, digits: 2,
      lfoAmountMax: 0.1, lfoAmountStep: 0.01 } },
];

// ---------------------------------------------------------------
// Chord layers: each X/Y channel can layer in up to two extra
// oscillators. "Chord" derives its frequency from the channel's own
// fundamental; "Chord 2" derives its frequency from Chord's (the
// "second wave"), chaining fundamental -> chord -> chord2. Each layer
// has its own Wave, Gain (with LFO), frequency Multiple, and Detune.
// Disabled layers keep running silently (gain forced to 0) rather than
// being torn down, so toggling them is instant and glitch-free.
// ---------------------------------------------------------------
const MULTIPLE_OPTIONS = [
  { v: 0.25, l: '1/4' },
  { v: 0.5, l: '1/2' },
  { v: 1, l: '1' },
  { v: 2, l: '2' },
  { v: 3, l: '3' },
  { v: 4, l: '4' },
  { v: 5, l: '5' },
];

// Detune range is 20% of its original +/-1 semitone span (+/-0.2 now).
const chordLevelDefs = ['X', 'Y'].flatMap(chan => [
  { prefix: `chord${chan}`, chan, levelLabel: 'Chord',
    gain: { key: `chord${chan}_gain`, label: 'Gain', min: 0, max: 1, def: 0.5, step: 0.01, digits: 2,
      lfoAmountMax: 0.5, lfoAmountStep: 0.01 },
    detune: { key: `chord${chan}_detune`, label: 'Detune', min: -0.2, max: 0.2, def: 0, step: 0.01, digits: 2, noLfo: true } },
  { prefix: `chord2${chan}`, chan, levelLabel: 'Chord 2',
    gain: { key: `chord2${chan}_gain`, label: 'Gain', min: 0, max: 1, def: 0.5, step: 0.01, digits: 2,
      lfoAmountMax: 0.5, lfoAmountStep: 0.01 },
    detune: { key: `chord2${chan}_detune`, label: 'Detune', min: -0.2, max: 0.2, def: 0, step: 0.01, digits: 2, noLfo: true } },
]);

const chordEls = {}; // prefix -> { enabledEl, bodyEl, waveEl, multipleEl }

function semitoneRatio(semitones) { return Math.pow(2, semitones / 12); }

// Solo display parameters, one card each.
const paramDefs = [
  { key: 'timeScale', label: 'Time Scale', min: 0.1, max: 1, def: 1, step: 0.01, digits: 2,
    lfoAmountMax: 0.08, lfoAmountStep: 0.01, blockLabel: 'Time Scale' },
  { key: 'hue', label: 'Trace Hue', min: 0, max: 360, def: 90, step: 1, digits: 0,
    lfoAmountMax: 360, lfoAmountStep: 0.1, lfoSpeedMax: 0.2, blockLabel: 'Trace Hue' },
  { key: 'rotation', label: 'Rotation', min: 0, max: 360, def: 0, step: 1, digits: 0,
    lfoAmountMax: 360, lfoAmountStep: 0.1, blockLabel: 'Trace Rotation (Waveform)' },
  // Adds to every Chord/Chord 2 detune (see updateChordAudio) so the
  // whole chord stack can be shifted in pitch together, on top of each
  // layer's own fine detune.
  { key: 'masterDetune', label: 'Master Detune', min: -2, max: 2, def: 0, step: 0.01, digits: 2,
    lfoAmountMax: 1, lfoAmountStep: 0.01, blockLabel: 'Master Detune' },
];

const compactParamDefs = [
  { key: 'persistence', label: 'Persistence', min: 0.01, max: 1, def: 0.24, step: 0.01, digits: 2, noLfo: true, log: true },
  { key: 'gain', label: 'Gain', min: 0.1, max: 1.25, def: 0.69, step: 0.01, digits: 2, noLfo: true },
  // Stretches one Persistence decay cycle across this many extra frames
  // (see render()) so the fade stays continuous/smooth every frame
  // instead of freezing then jumping - 0 decays at the raw Persistence
  // rate every frame, as before.
  { key: 'hold', label: 'Hold', min: 0, max: 60, def: 0, step: 1, digits: 0, noLfo: true },
  { key: 'lineWidth', label: 'Line Width', min: 0.5, max: 15, def: 1.5, step: 0.1, digits: 1, noLfo: true },
  // Rate multiplier for the shared time proxy (see simTime in frame())
  // that every LFO reads its phase from - 1x is normal speed, 0.0001x is
  // nearly frozen. Capped at 1x: this is a slow-motion control, not a
  // speed-up. log:true makes the slider itself logarithmic (see
  // paramRowsHTML/wireParamBlock/syncParamControlsFromState).
  { key: 'masterTime', label: 'Master Time', min: 0.0001, max: 1, def: 1, step: 0.0001, digits: 4, noLfo: true, log: true },
];

const lineWidthDef = compactParamDefs.find(d => d.key === 'lineWidth');

const ALL_PARAMS = [
  ...channelDefs.flatMap(ch => [ch.freq, ch.phase, ch.gain]),
  ...chordLevelDefs.flatMap(c => [c.gain, c.detune]),
  ...paramDefs,
  ...compactParamDefs,
];

const paramDefByKey = {};
ALL_PARAMS.forEach(d => { paramDefByKey[d.key] = d; });

function defaultParamState(def) {
  return { value: def.def, lfoSpeed: 0, lfoAmount: 0 };
}

const paramState = {};
ALL_PARAMS.forEach(d => { paramState[d.key] = defaultParamState(d); });

const paramEls = {};

function paramRowsHTML(def) {
  const sliderMin = def.log ? Math.log10(def.min) : def.min;
  const sliderMax = def.log ? Math.log10(def.max) : def.max;
  const sliderVal = def.log ? Math.log10(def.def) : def.def;
  const sliderStep = def.log ? 0.001 : def.step;
  let html = `
    <div class="row">
      <label for="${def.key}_value">${def.label}</label>
      <input type="range" id="${def.key}_value" min="${sliderMin}" max="${sliderMax}" step="${sliderStep}" value="${sliderVal}">
      <span class="readout" id="${def.key}_valueVal">${def.def.toFixed(def.digits)}</span>
    </div>`;
  if (!def.noLfo) {
    const lfoSpeedMax = def.lfoSpeedMax || LFO_SPEED_MAX;
    html += `
    <div class="subhead">${def.lfoLabel || 'LFO'}</div>
    <div class="row">
      <label for="${def.key}_lfoSpeed">Speed</label>
      <input type="range" id="${def.key}_lfoSpeed" min="0" max="${lfoSpeedMax}" step="${lfoSpeedMax / 50}" value="0">
      <span class="readout" id="${def.key}_lfoSpeedVal">0.00</span>
    </div>
    <div class="row">
      <label for="${def.key}_lfoAmount">Amount</label>
      <input type="range" id="${def.key}_lfoAmount" min="0" max="${def.lfoAmountMax}" step="${def.lfoAmountStep}" value="0">
      <span class="readout" id="${def.key}_lfoAmountVal">${(0).toFixed(lfoDigits(def))}</span>
    </div>`;
  }
  return html;
}

function buildParamBlock(def) {
  const fs = document.createElement('fieldset');
  fs.className = 'group param-block';
  fs.innerHTML = `<legend>${def.blockLabel || def.label}</legend>${paramRowsHTML(def)}`;
  return fs;
}

function wireParamBlock(def) {
  const st = paramState[def.key];
  const get = (suffix) => document.getElementById(`${def.key}${suffix}`);
  const pe = {
    valueEl: get('_value'), valueVal: get('_valueVal'),
    lfoSpeedEl: def.noLfo ? null : get('_lfoSpeed'),
    lfoSpeedVal: def.noLfo ? null : get('_lfoSpeedVal'),
    lfoAmountEl: def.noLfo ? null : get('_lfoAmount'),
    lfoAmountVal: def.noLfo ? null : get('_lfoAmountVal'),
  };
  paramEls[def.key] = pe;

  pe.valueEl.addEventListener('input', () => {
    const raw = parseFloat(pe.valueEl.value);
    st.value = def.log ? Math.pow(10, raw) : raw;
    pe.valueVal.textContent = st.value.toFixed(def.digits);
  });

  if (!def.noLfo) {
    pe.lfoSpeedEl.addEventListener('input', () => {
      st.lfoSpeed = parseFloat(pe.lfoSpeedEl.value);
      pe.lfoSpeedVal.textContent = st.lfoSpeed.toFixed(2);
    });
    pe.lfoAmountEl.addEventListener('input', () => {
      st.lfoAmount = parseFloat(pe.lfoAmountEl.value);
      pe.lfoAmountVal.textContent = st.lfoAmount.toFixed(lfoDigits(def));
    });
  }
}

function chordLevelHTML(c) {
  return `
    <div class="subhead">${c.levelLabel}</div>
    <div class="row checks">
      <label class="check"><input type="checkbox" id="${c.prefix}_enabled"> Enable</label>
    </div>
    <div id="${c.prefix}_body" hidden>
      <div class="row">
        <label for="${c.prefix}_wave">Wave</label>
        <select id="${c.prefix}_wave">
          ${WAVE_OPTIONS.map(w => `<option value="${w}" ${w === 'sine' ? 'selected' : ''}>${w[0].toUpperCase() + w.slice(1)}</option>`).join('')}
        </select>
      </div>
      ${paramRowsHTML(c.gain)}
      <div class="row">
        <label for="${c.prefix}_multiple">Multiple</label>
        <select id="${c.prefix}_multiple">
          ${MULTIPLE_OPTIONS.map(o => `<option value="${o.v}" ${o.v === 1 ? 'selected' : ''}>${o.l}</option>`).join('')}
        </select>
      </div>
      ${paramRowsHTML(c.detune)}
    </div>
  `;
}

function wireChordLevel(c) {
  wireParamBlock(c.gain);
  wireParamBlock(c.detune);

  const enabledEl = document.getElementById(`${c.prefix}_enabled`);
  const bodyEl = document.getElementById(`${c.prefix}_body`);
  const waveEl = document.getElementById(`${c.prefix}_wave`);
  const multipleEl = document.getElementById(`${c.prefix}_multiple`);
  chordEls[c.prefix] = { enabledEl, bodyEl, waveEl, multipleEl };

  enabledEl.addEventListener('change', () => { bodyEl.hidden = !enabledEl.checked; });
  waveEl.addEventListener('change', () => {
    const osc = current[`${c.prefix}Osc`];
    if (osc) osc.type = waveEl.value;
  });
}

function mountChannelBlock(ch) {
  const fs = document.createElement('fieldset');
  fs.className = 'group param-block';
  const myChordLevels = chordLevelDefs.filter(c => c.chan === ch.chanKey);
  fs.innerHTML = `
    <legend>${ch.label}</legend>
    <div class="row">
      <label for="${ch.waveKey}">Wave</label>
      <select id="${ch.waveKey}">
        ${WAVE_OPTIONS.map(w => `<option value="${w}" ${w === 'sine' ? 'selected' : ''}>${w[0].toUpperCase() + w.slice(1)}</option>`).join('')}
      </select>
    </div>
    ${paramRowsHTML(ch.freq)}
    ${paramRowsHTML(ch.phase)}
    ${paramRowsHTML(ch.gain)}
    ${myChordLevels.map(chordLevelHTML).join('')}
  `;
  els.toneGroup.appendChild(fs);
  wireParamBlock(ch.freq);
  wireParamBlock(ch.phase);
  wireParamBlock(ch.gain);
  myChordLevels.forEach(wireChordLevel);

  const waveEl = document.getElementById(ch.waveKey);
  waveEl.addEventListener('change', () => {
    const osc = ch.chanKey === 'X' ? current.oscX : current.oscY;
    if (osc) osc.type = waveEl.value;
  });
}

function mountParamBlocks() {
  channelDefs.forEach(mountChannelBlock);

  paramDefs.forEach(def => {
    const fs = buildParamBlock(def);
    els.displayParams.appendChild(fs);
    wireParamBlock(def);
    if (def.key === 'rotation') rotationFieldset = fs;
  });

  const compactFs = document.createElement('fieldset');
  compactFs.className = 'group param-block';
  compactFs.innerHTML = `<legend>Persistence, Gain, Line Width &amp; Master Time</legend>${compactParamDefs.map(paramRowsHTML).join('')}`;
  els.compactParams.appendChild(compactFs);
  compactParamDefs.forEach(wireParamBlock);
}

function syncParamControlsFromState(def) {
  const st = paramState[def.key];
  const pe = paramEls[def.key];
  pe.valueEl.value = def.log ? Math.log10(st.value) : st.value;
  pe.valueVal.textContent = st.value.toFixed(def.digits);
  if (!def.noLfo) {
    pe.lfoSpeedEl.value = st.lfoSpeed; pe.lfoSpeedVal.textContent = st.lfoSpeed.toFixed(2);
    pe.lfoAmountEl.value = st.lfoAmount; pe.lfoAmountVal.textContent = st.lfoAmount.toFixed(lfoDigits(def));
  }
}

function getEffective(def, now) {
  const st = paramState[def.key];
  const lfo = st.lfoAmount * Math.sin((now / 1000) * st.lfoSpeed * Math.PI * 2);
  return Math.min(def.max, Math.max(def.min, st.value + lfo));
}

// ---------------------------------------------------------------
// Source management: every source exposes analyserX / analyserY
// (time-domain) that the renderer reads from, regardless of origin.
// ---------------------------------------------------------------
const current = { analyserX: null, analyserY: null, teardown: null };

function makeAnalyser(ctxA) {
  const a = ctxA.createAnalyser();
  a.fftSize = FFT_SIZE;
  return a;
}

// The Web Audio graph only processes nodes reachable from `destination`.
// Live-capture sources (mic, line out) route through a zero-gain sink so
// they're still processed without looping their own audio back out.
function makeSilentSink(ctxA) {
  const g = ctxA.createGain();
  g.gain.value = 0;
  g.connect(ctxA.destination);
  return g;
}

// The test tone is meant to be heard, so it gets an actual audible sink
// instead - kept modest since raw oscillators can be harsh at full volume.
function makeAudibleSink(ctxA, gainValue = 0.2) {
  const g = ctxA.createGain();
  g.gain.value = gainValue;
  g.connect(ctxA.destination);
  return g;
}

function teardownSource() {
  if (current.teardown) current.teardown();
  current.teardown = null;
  current.analyserX = null;
  current.analyserY = null;
  current.sink = null;
}

// Phase is applied via a DelayNode ahead of each channel's mix bus: a
// delay of (phase/360) full periods of the current frequency is
// indistinguishable from a true phase offset for a steady periodic
// wave, and it's the only way to get a live, continuously adjustable
// phase out of OscillatorNode.
const MAX_PHASE_DELAY = 0.1;

function setupTone() {
  teardownSource();
  const ac = getAudioCtx();
  const oscX = ac.createOscillator();
  const oscY = ac.createOscillator();
  const gainX = ac.createGain();
  const gainY = ac.createGain();
  const delayX = ac.createDelay(MAX_PHASE_DELAY);
  const delayY = ac.createDelay(MAX_PHASE_DELAY);
  const mixX = ac.createGain();
  const mixY = ac.createGain();
  const analyserX = makeAnalyser(ac);
  const analyserY = makeAnalyser(ac);
  oscX.type = document.getElementById('waveX').value;
  oscX.frequency.value = paramState.freqX.value;
  oscY.type = document.getElementById('waveY').value;
  oscY.frequency.value = paramState.freqY.value;
  gainX.gain.value = paramState.oscGainX.value;
  gainY.gain.value = paramState.oscGainY.value;
  const sink = makeAudibleSink(ac, toneMuted ? 0 : TONE_AUDIBLE_GAIN);

  // Gain is staged on the fundamental BEFORE it reaches the mix bus that
  // the chord oscillators feed into, so it controls the fundamental's own
  // level (real audible amplitude, not just a display scale) ahead of
  // anything the chord layers add - each chord layer has its own gain.
  oscX.connect(gainX).connect(delayX).connect(mixX);
  oscY.connect(gainY).connect(delayY).connect(mixY);
  mixX.connect(analyserX).connect(sink);
  mixY.connect(analyserY).connect(sink);
  oscX.start();
  oscY.start();

  current.analyserX = analyserX;
  current.analyserY = analyserY;
  current.gainX = gainX;
  current.gainY = gainY;
  current.delayX = delayX;
  current.delayY = delayY;
  current.oscX = oscX;
  current.oscY = oscY;
  current.sink = sink;

  const extraNodes = [];
  chordLevelDefs.forEach(c => {
    const mix = c.chan === 'X' ? mixX : mixY;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    gain.gain.value = 0;
    osc.type = document.getElementById(`${c.prefix}_wave`).value;
    osc.frequency.value = 440;
    osc.connect(gain).connect(mix);
    osc.start();
    current[`${c.prefix}Osc`] = osc;
    current[`${c.prefix}Gain`] = gain;
    extraNodes.push(osc, gain);
  });

  current.teardown = () => {
    oscX.stop(); oscY.stop();
    oscX.disconnect(); oscY.disconnect();
    gainX.disconnect(); gainY.disconnect();
    delayX.disconnect(); delayY.disconnect();
    mixX.disconnect(); mixY.disconnect();
    extraNodes.forEach(n => { if (n.stop) n.stop(); n.disconnect(); });
  };
}

// Walks fundamental -> Chord -> Chord 2 per channel, deriving each
// layer's frequency from the one before it, and forces disabled
// layers' gain to 0 rather than stopping their oscillators.
function updateChordAudio(eff) {
  ['X', 'Y'].forEach(chan => {
    // Master Time dilates the fundamental the same way it dilates the
    // oscillator itself, so chords stay in their set ratio to it.
    let prevFreq = (chan === 'X' ? eff.freqX : eff.freqY) * eff.masterTime;
    chordLevelDefs.filter(c => c.chan === chan).forEach(c => {
      const refs = chordEls[c.prefix];
      if (!refs) return;
      const multiple = parseFloat(refs.multipleEl.value);
      const freq = prevFreq * multiple * semitoneRatio(eff[c.detune.key] + eff.masterDetune);
      const osc = current[`${c.prefix}Osc`];
      const gainNode = current[`${c.prefix}Gain`];
      if (osc) osc.frequency.value = freq;
      if (gainNode) gainNode.gain.value = refs.enabledEl.checked ? eff[c.gain.key] : 0;
      prevFreq = freq;
    });
  });
}

// Shared by any live MediaStream-based source (mic, line out): wires the
// stream into an analyser pair through a silent sink so it's processed
// without being looped back out to the speakers.
async function setupLiveSource(getStream, label) {
  teardownSource();
  els.liveStatusRow.hidden = false;
  els.liveStatus.textContent = `Requesting ${label} access...`;
  const ac = getAudioCtx();
  try {
    const stream = await getStream();
    if (stream.getAudioTracks().length === 0) {
      stream.getTracks().forEach(t => t.stop());
      els.liveStatus.textContent = `${label} failed: no audio track was shared.`;
      return;
    }
    // Deliberately NOT stopping the video track: Chrome ties a display-
    // capture's audio to its video track's lifecycle, so stopping video
    // early kills the audio capture too. It's just never rendered anywhere,
    // and teardown() below stops both tracks together when the source
    // actually changes.

    const src = ac.createMediaStreamSource(stream);
    const splitter = ac.createChannelSplitter(2);
    const analyserX = makeAnalyser(ac);
    const analyserY = makeAnalyser(ac);
    const sink = makeSilentSink(ac);
    src.connect(splitter);
    splitter.connect(analyserX, 0);
    splitter.connect(analyserY, Math.min(1, src.channelCount - 1));
    analyserX.connect(sink);
    analyserY.connect(sink);

    current.analyserX = analyserX;
    current.analyserY = analyserY;
    current.teardown = () => { stream.getTracks().forEach(t => t.stop()); src.disconnect(); splitter.disconnect(); };
    els.liveStatus.textContent = `${label} connected (${src.channelCount}ch).`;
  } catch (err) {
    els.liveStatus.textContent = `${label} access failed: ${err.message}`;
  }
}

function setupMic() {
  return setupLiveSource(
    () => navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    }),
    'Microphone'
  );
}

// Browsers have no direct "line out" tap; getDisplayMedia's tab/window/
// screen share (with its audio checkbox) is the closest thing - it lets
// you capture whatever another tab, browser window, or app is actually
// playing. systemAudio/selfBrowserSurface are Chrome-only hints (ignored
// elsewhere): they push the picker toward offering audio for whatever's
// shared and away from capturing this tab itself, which has nothing to
// hear from unless the tone is enabled.
function setupLineOut() {
  return setupLiveSource(
    () => navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true,
      systemAudio: 'include',
      selfBrowserSurface: 'exclude',
    }),
    'Line Out'
  );
}

function setupFile(file) {
  teardownSource();
  els.liveStatusRow.hidden = true;
  if (!file) return;
  const ac = getAudioCtx();
  const reader = new FileReader();
  reader.onload = () => {
    ac.decodeAudioData(reader.result).then(buffer => {
      const src = ac.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      const splitter = ac.createChannelSplitter(2);
      const analyserX = makeAnalyser(ac);
      const analyserY = makeAnalyser(ac);
      src.connect(splitter);
      splitter.connect(analyserX, 0);
      splitter.connect(analyserY, Math.min(1, buffer.numberOfChannels - 1));
      src.connect(ac.destination);
      src.start();

      current.analyserX = analyserX;
      current.analyserY = analyserY;
      current.teardown = () => { src.stop(); src.disconnect(); splitter.disconnect(); };
    }).catch(err => {
      els.liveStatusRow.hidden = false;
      els.liveStatus.textContent = `Could not decode file: ${err.message}`;
    });
  };
  reader.readAsArrayBuffer(file);
}

function applySource(kind) {
  els.fileRow.hidden = kind !== 'file';
  els.liveStatusRow.hidden = kind !== 'mic' && kind !== 'lineout';
  updateVisibility();
  if (kind === 'tone') setupTone();
  else if (kind === 'mic') setupMic();
  else if (kind === 'lineout') setupLineOut();
  else if (kind === 'file') teardownSource();
}

// ---------------------------------------------------------------
// Controls
// ---------------------------------------------------------------
els.sourceSelect.addEventListener('change', () => applySource(els.sourceSelect.value));
els.fileInput.addEventListener('change', () => setupFile(els.fileInput.files[0]));
els.modeSelect.addEventListener('change', () => { display.mode = els.modeSelect.value; updateVisibility(); });
els.showGrid.addEventListener('change', () => { display.showGrid = els.showGrid.checked; });
els.glow.addEventListener('change', () => { display.glow = els.glow.checked; });

// Mutes the Test Tone's speaker output only - the analysers tap the
// signal upstream of the sink, so the trace keeps animating normally.
els.muteBtn.addEventListener('click', () => {
  toneMuted = !toneMuted;
  els.muteBtn.classList.toggle('active', toneMuted);
  els.muteBtn.textContent = toneMuted ? 'Unmute Tone' : 'Mute Tone';
  if (current.sink) current.sink.gain.value = toneMuted ? 0 : TONE_AUDIBLE_GAIN;
});

els.freezeBtn.addEventListener('click', () => {
  frozen = !frozen;
  els.freezeBtn.classList.toggle('active', frozen);
  els.freezeBtn.textContent = frozen ? 'Unfreeze' : 'Freeze';
});

// Distinct from Freeze: this suspends the AudioContext itself, so the
// signal (tone/mic/line out/file) actually stops rather than just the
// display. Suspending pauses every node in the graph, so it works the
// same regardless of which source is active.
els.pauseBtn.addEventListener('click', () => {
  const ac = getAudioCtx();
  if (ac.state === 'running') {
    ac.suspend();
    els.pauseBtn.classList.add('active');
    els.pauseBtn.textContent = 'Resume Signal';
  } else if (ac.state === 'suspended') {
    ac.resume();
    els.pauseBtn.classList.remove('active');
    els.pauseBtn.textContent = 'Pause Signal';
  }
});

els.resetBtn.addEventListener('click', () => {
  display.mode = DEFAULTS.mode;
  display.showGrid = DEFAULTS.showGrid;
  display.glow = DEFAULTS.glow;
  els.modeSelect.value = DEFAULTS.mode;
  els.showGrid.checked = DEFAULTS.showGrid;
  els.glow.checked = DEFAULTS.glow;

  document.getElementById('waveX').value = 'sine';
  document.getElementById('waveY').value = 'sine';
  if (current.oscX) current.oscX.type = 'sine';
  if (current.oscY) current.oscY.type = 'sine';

  chordLevelDefs.forEach(c => {
    const refs = chordEls[c.prefix];
    if (!refs) return;
    refs.enabledEl.checked = false;
    refs.bodyEl.hidden = true;
    refs.waveEl.value = 'sine';
    refs.multipleEl.value = '1';
    const osc = current[`${c.prefix}Osc`];
    if (osc) osc.type = 'sine';
  });

  ALL_PARAMS.forEach(def => {
    Object.assign(paramState[def.key], defaultParamState(def));
    syncParamControlsFromState(def);
  });

  frozen = false;
  els.freezeBtn.classList.remove('active');
  els.freezeBtn.textContent = 'Freeze';
  toneMuted = false;
  els.muteBtn.classList.remove('active');
  els.muteBtn.textContent = 'Mute Tone';
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  els.pauseBtn.classList.remove('active');
  els.pauseBtn.textContent = 'Pause Signal';
  els.sourceSelect.value = DEFAULTS.source;
  applySource(DEFAULTS.source);
});

// ---------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------
function drawGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(60, 100, 70, 0.35)';
  ctx.lineWidth = 1;
  const divisions = 10;
  for (let i = 1; i < divisions; i++) {
    const p = (i / divisions) * W;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(W, p); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(90, 150, 100, 0.6)';
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  ctx.restore();
}

function traceStyle(eff) {
  // Opacity is inverse to line width: fully opaque at the thinnest
  // setting, fading linearly down to 50% at the thickest.
  const widthFrac = (eff.lineWidth - lineWidthDef.min) / (lineWidthDef.max - lineWidthDef.min);
  const opacity = 1 - 0.5 * widthFrac;
  const color = `hsla(${eff.hue}, 90%, 60%, ${opacity})`;
  ctx.strokeStyle = color;
  ctx.lineWidth = eff.lineWidth;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  // The new stroke blends onto the still-fading persisted trail with
  // Lighten Only (per-channel max) instead of normal alpha compositing,
  // so self-intersections and repeated passes accumulate brightness
  // instead of just overwriting/dimming what's already there.
  ctx.globalCompositeOperation = 'lighten';
  if (display.glow) {
    ctx.shadowBlur = 14;
    ctx.shadowColor = color;
  } else {
    ctx.shadowBlur = 0;
  }
}

function drawWaveform(analyser, eff) {
  const len = analyser.frequencyBinCount;
  const data = new Float32Array(len);
  analyser.getFloatTimeDomainData(data);

  const count = Math.max(8, Math.min(len, Math.round(len / eff.timeScale)));
  traceStyle(eff);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(eff.rotation * Math.PI / 180);
  ctx.translate(-W / 2, -H / 2);
  ctx.beginPath();
  for (let i = 0; i < count; i++) {
    const x = (i / (count - 1)) * W;
    const y = H / 2 - data[i] * eff.gain * (H / 2) * 0.9;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawXY(analyserX, analyserY, eff) {
  const len = Math.min(analyserX.frequencyBinCount, analyserY.frequencyBinCount);
  const dataX = new Float32Array(len);
  const dataY = new Float32Array(len);
  analyserX.getFloatTimeDomainData(dataX);
  analyserY.getFloatTimeDomainData(dataY);

  const count = Math.max(8, Math.min(len, Math.round(len / eff.timeScale)));
  traceStyle(eff);
  ctx.beginPath();
  for (let i = 0; i < count; i++) {
    const x = W / 2 + dataX[i] * eff.gain * (W / 2) * 0.9;
    const y = H / 2 - dataY[i] * eff.gain * (H / 2) * 0.9;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

// now = simTime, the shared time proxy accumulated in frame() below.
function render(now) {
  const eff = {};
  ALL_PARAMS.forEach(d => { eff[d.key] = getEffective(d, now); });

  // Reset composite mode before fading/grid: traceStyle() switches to
  // 'lighten' for the trace stroke, and that must not leak into these.
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
  // Hold stretches one Persistence decay cycle across (hold+1) frames so
  // the fade stays continuous instead of freezing then jumping: each
  // frame applies a fractional-power "survival" factor such that after
  // (hold+1) frames the cumulative decay equals one full Persistence
  // multiplication. hold=0 reduces to the original per-frame behavior.
  const holdFrames = eff.hold + 1;
  const survival = Math.pow(Math.max(0, Math.min(1, eff.persistence)), 1 / holdFrames);
  ctx.fillStyle = `rgba(0, 0, 0, ${Math.max(0, 1 - survival)})`;
  ctx.fillRect(0, 0, W, H);

  if (display.showGrid) drawGrid();

  if (current.analyserX && (display.mode === 'waveform' || current.analyserY)) {
    if (display.mode === 'xy' && current.analyserY) {
      drawXY(current.analyserX, current.analyserY, eff);
    } else {
      drawWaveform(current.analyserX, eff);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  // Master Time also dilates the X/Y oscillators themselves (not just
  // their LFOs): more cycles per real second at faster-than-1x, fewer at
  // slower - like changing the rate a tape is running at. Phase's delay
  // is computed from that same dilated frequency so the phase offset
  // (a fraction of one period) stays correct at any Master Time.
  const dilatedFreqX = eff.freqX * eff.masterTime;
  const dilatedFreqY = eff.freqY * eff.masterTime;
  if (current.oscX) current.oscX.frequency.value = dilatedFreqX;
  if (current.oscY) current.oscY.frequency.value = dilatedFreqY;
  if (current.gainX) current.gainX.gain.value = eff.oscGainX;
  if (current.gainY) current.gainY.gain.value = eff.oscGainY;
  if (current.delayX) current.delayX.delayTime.value = Math.min(MAX_PHASE_DELAY, (eff.phaseX / 360) * (1 / dilatedFreqX));
  if (current.delayY) current.delayY.delayTime.value = Math.min(MAX_PHASE_DELAY, (eff.phaseY / 360) * (1 / dilatedFreqY));
  updateChordAudio(eff);
}

// The time proxy every parameter's LFO reads its phase from. It's an
// accumulator (elapsed real time integrated at the current Master Time
// rate) rather than `now * masterTime` directly, so changing Master Time
// mid-session smoothly changes the rate instead of snapping every LFO's
// phase to a different point (which multiplying the raw timestamp would
// do, since the timestamp itself keeps growing from page load).
let simTime = 0;
let lastFrameTime = null;

function frame(now) {
  if (lastFrameTime === null) lastFrameTime = now;
  const dtMs = Math.min(now - lastFrameTime, 100);
  lastFrameTime = now;
  if (!frozen) {
    simTime += dtMs * paramState.masterTime.value;
    render(simTime);
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------
// Presets: saves/restores every slider value + LFO, wave/multiple
// selects, chord enable state, and display mode/grid/glow to
// localStorage, so a favorite interaction can be recalled later.
// ---------------------------------------------------------------
const PRESET_STORAGE_KEY = 'oscilloscopeVisualizerPresets';

function loadPresets() {
  try {
    const raw = localStorage.getItem(PRESET_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    return [];
  }
}

function savePresetsToStorage() {
  try {
    localStorage.setItem(PRESET_STORAGE_KEY, JSON.stringify(presets));
  } catch (err) { /* storage unavailable or full - preset just won't persist */ }
}

let presets = loadPresets();

function capturePresetState() {
  const params = {};
  ALL_PARAMS.forEach(d => {
    const st = paramState[d.key];
    params[d.key] = { value: st.value, lfoSpeed: st.lfoSpeed, lfoAmount: st.lfoAmount };
  });
  const chords = {};
  chordLevelDefs.forEach(c => {
    const refs = chordEls[c.prefix];
    chords[c.prefix] = {
      enabled: refs ? refs.enabledEl.checked : false,
      wave: refs ? refs.waveEl.value : 'sine',
      multiple: refs ? refs.multipleEl.value : '1',
    };
  });
  return {
    params,
    waveX: document.getElementById('waveX').value,
    waveY: document.getElementById('waveY').value,
    chords,
    display: { mode: display.mode, showGrid: display.showGrid, glow: display.glow },
  };
}

function applyPresetState(state) {
  Object.keys(state.params).forEach(key => {
    const def = paramDefByKey[key];
    if (!def) return; // ignore params from an older/newer version of the app
    Object.assign(paramState[key], state.params[key]);
    syncParamControlsFromState(def);
  });

  document.getElementById('waveX').value = state.waveX;
  document.getElementById('waveY').value = state.waveY;
  if (current.oscX) current.oscX.type = state.waveX;
  if (current.oscY) current.oscY.type = state.waveY;

  chordLevelDefs.forEach(c => {
    const saved = state.chords && state.chords[c.prefix];
    const refs = chordEls[c.prefix];
    if (!saved || !refs) return;
    refs.enabledEl.checked = saved.enabled;
    refs.bodyEl.hidden = !saved.enabled;
    refs.waveEl.value = saved.wave;
    refs.multipleEl.value = saved.multiple;
    const osc = current[`${c.prefix}Osc`];
    if (osc) osc.type = saved.wave;
  });

  if (state.display) {
    display.mode = state.display.mode;
    display.showGrid = state.display.showGrid;
    display.glow = state.display.glow;
    els.modeSelect.value = state.display.mode;
    els.showGrid.checked = state.display.showGrid;
    els.glow.checked = state.display.glow;
    updateVisibility();
  }
}

function randomInRange(def) {
  if (def.log) {
    const lo = Math.log10(def.min), hi = Math.log10(def.max);
    return Math.pow(10, lo + Math.random() * (hi - lo));
  }
  return def.min + Math.random() * (def.max - def.min);
}

function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// Randomizes every slider's base value plus the X/Y and chord wave
// shapes and chord frequency multiples. LFOs, chord enable toggles,
// source, and display mode are left alone so a randomize pass stays a
// surprise on the current patch rather than a completely different one.
function randomizeParams() {
  ALL_PARAMS.forEach(def => {
    paramState[def.key].value = randomInRange(def);
    syncParamControlsFromState(def);
  });

  const waveX = randomChoice(WAVE_OPTIONS);
  const waveY = randomChoice(WAVE_OPTIONS);
  document.getElementById('waveX').value = waveX;
  document.getElementById('waveY').value = waveY;
  if (current.oscX) current.oscX.type = waveX;
  if (current.oscY) current.oscY.type = waveY;

  chordLevelDefs.forEach(c => {
    const refs = chordEls[c.prefix];
    if (!refs) return;
    const wave = randomChoice(WAVE_OPTIONS);
    refs.waveEl.value = wave;
    refs.multipleEl.value = randomChoice(MULTIPLE_OPTIONS).v;
    const osc = current[`${c.prefix}Osc`];
    if (osc) osc.type = wave;
  });
}

function startRenamePreset(preset, nameSpan) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'preset-name-input';
  input.value = preset.name;
  nameSpan.replaceWith(input);
  input.focus();
  input.select();

  let committed = false;
  const commit = () => {
    if (committed) return;
    committed = true;
    const newName = input.value.trim();
    if (newName) preset.name = newName;
    savePresetsToStorage();
    renderPresetList();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    else if (e.key === 'Escape') { committed = true; renderPresetList(); }
  });
  input.addEventListener('blur', commit);
  input.addEventListener('click', (e) => e.stopPropagation());
  input.addEventListener('dblclick', (e) => e.stopPropagation());
}

function renderPresetList() {
  els.presetList.innerHTML = '';
  if (presets.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'preset-empty';
    empty.textContent = 'No saved presets yet.';
    els.presetList.appendChild(empty);
    return;
  }
  // Break savedAt ties (e.g. two saves in the same millisecond) using
  // array position, since presets are always appended in save order -
  // otherwise same-millisecond saves could sort out of order.
  presets.map((preset, i) => ({ preset, i }))
    .sort((a, b) => (b.preset.savedAt - a.preset.savedAt) || (b.i - a.i))
    .forEach(({ preset }) => {
    const item = document.createElement('div');
    item.className = 'preset-item';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'preset-name';
    nameSpan.textContent = preset.name;
    nameSpan.title = preset.name;

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'preset-delete';
    delBtn.textContent = '×';
    delBtn.title = 'Delete preset';

    item.appendChild(nameSpan);
    item.appendChild(delBtn);
    els.presetList.appendChild(item);

    item.addEventListener('click', () => applyPresetState(preset.state));
    nameSpan.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startRenamePreset(preset, nameSpan);
    });
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      presets = presets.filter(p => p.id !== preset.id);
      savePresetsToStorage();
      renderPresetList();
    });
  });
}

els.savePresetBtn.addEventListener('click', () => {
  presets.push({
    id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    name: `Preset ${presets.length + 1}`,
    savedAt: Date.now(),
    state: capturePresetState(),
  });
  savePresetsToStorage();
  renderPresetList();
});

els.randomizeBtn.addEventListener('click', randomizeParams);

mountParamBlocks();
document.querySelectorAll('input[type="range"]').forEach(enableFineDrag);
applySource(DEFAULTS.source);
renderPresetList();
requestAnimationFrame(frame);
</script>
</body>
</html>
