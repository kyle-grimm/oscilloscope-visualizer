'use strict';
/* L9 Loop prototype.
   Engine and controls follow the original Oscilloscope Visualizer (Documents/Code/oscilloscope-visualizer, script.js):
   X and Y channels, each a fundamental (wave, freq 20-500 Hz, phase, phase speed, gain) plus two chord layers chained
   fundamental -> Chord -> Chord 2 (wave, gain, detune, multiple / divide 1-13). A chord layer either adds into its channel
   or, with FM on (the ring between it and its mother), frequency-modulates its mother and leaves the mix.
   Effects: Filter -> Band Pass -> Saturation -> Chorus, each bypassable. Output: 0.2 gain, then the original's fatigue guard.
   Panel: osc 1-3 = X (left, red), osc 4-6 = Y (right, green). Two windows: Source & Display, Effects (with Master Gain, Time,
   Fast, Detune). The panel is 4:3 (L9 landscape, 1440 x 1080) or 3:4 (L9v portrait, 900 x 1200). */

}

function toV(d, x) {
  if (d.log) {
    if (d.logMid) return x <= d.logMid ? 0.5 * Math.log(x / d.min) / Math.log(d.logMid / d.min) : 0.5 + 0.5 * Math.log(x / d.logMid) / Math.log(d.max / d.logMid);
    return Math.log(x / d.min) / Math.log(d.max / d.min);
  }
  return clamp((x - d.min) / (d.max - d.min));
}
function fromV(d, v) {
  v = clamp(v);
  var x = d.log ? (d.logMid ? (v <= 0.5 ? d.min * Math.pow(d.logMid / d.min, v / 0.5) : d.logMid * Math.pow(d.max / d.logMid, (v - 0.5) / 0.5)) : d.min * Math.pow(d.max / d.min, v))

  if (d.step) x = +(Math.round(x / d.step) * d.step).toFixed(6);

  return clamp(x, d.min, d.max);

      for (var t = 0; t < win; t++) { var v = chn[0][(start + trig + t) & SN1], xx = t / (win - 1) * W, yy = chn[2] - v * st.gain * (H / 4) * 0.9; if (t) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
      c.stroke();
    });
    c.restore();
  }
  c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0;
}

// ---------------------------------------------------------------- run loop and window fit
var pL = new Float32Array(4096), pR = new Float32Array(4096), zero = new Float32Array(4096), lastT = 0, blink = 0;
E.init(48000);
function frame(t) {
  var dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 1 / 60; lastT = t;
  if (!A.running) E.process(zero, zero, pL, pR, Math.min(4096, Math.round(E.sr * dt)));   // silent preview until Play
  if (!state.freeze) { realT += dt; drawScope(); drawAnalyzer(dt); }
  if (!A.running) { blink += dt; ui.playK.set(Math.floor(blink * 2) % 2 ? 'on' : 'off'); }
  else if (A.recorder) { blink += dt; ui.recK.set(Math.floor(blink * 2) % 2 ? 'rec' : 'off'); }
  requestAnimationFrame(frame);
}
var layoutKey = null, layoutH = 0, rebuildT = 0;
function wanted() {
  var h = location.hash, ww = window.innerWidth, wh = window.innerHeight;
  var lk = h === '#portrait' ? 'port' : h === '#landscape' ? 'land' : (wh > ww ? 'port' : 'land');
  var H = lk === 'land' ? 1080 : 1200;   // fixed 4:3 (1440 x 1080) or 3:4 (900 x 1200), letterboxed to the window
  return { lk: lk, H: H };
}
function scaleToWindow() {
  var k = Math.min(window.innerWidth / GEO.W, window.innerHeight / GEO.H);
  stage.dataset.scale = String(k);
  stage.style.transform = 'translate(' + ((window.innerWidth - GEO.W * k) / 2) + 'px,' + ((window.innerHeight - GEO.H * k) / 2) + 'px) scale(' + k + ')';
}
function fit() {
  var w = wanted();
  if (w.lk !== layoutKey || Math.abs(w.H - layoutH) > 2) { layoutKey = w.lk; layoutH = w.H; build(w.lk, w.H); }
  scaleToWindow();
}
window.addEventListener('resize', function () { scaleToWindow(); clearTimeout(rebuildT); rebuildT = setTimeout(fit, 150); });
window.addEventListener('hashchange', fit);
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.getAttribute && e.target.getAttribute('role') === 'slider') return;
  if (e.code === 'Space') { e.preventDefault(); if (A.running) stop(); else play(); }
  if (e.key === 'm' || e.key === 'M') ui.mute.b.click();
  if (e.key === 'f' || e.key === 'F') ui.freeze.b.click();
  if (e.key === 'h' || e.key === 'H') ui.hold.b.click();
});
fit();
requestAnimationFrame(frame);

// ---------------------------------------------------------------- self-test (index.html#selftest), JSON in #__report
if (location.hash === '#selftest') {
  (function () {
    var out = {}, n = 4800, L = new Float32Array(n), R = new Float32Array(n);
    var run = function () { E.init(48000); E.process(zero, zero, L, R, n); var pk = 0, bad = 0; for (var i = 0; i < n; i++) { if (!isFinite(L[i]) || !isFinite(R[i])) bad++; pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i])); } return { peak: +pk.toFixed(3), bad: bad }; };
    var zc = function () { var z = 0; for (var i = 1; i < n; i++) if (L[i - 1] < 0 && L[i] >= 0) z++; return z; };
    out.presets = PRESETS.length; out.firstPresets = PRESETS.slice(0, 3).map(function (p) { return p.name; });
    out.defaultTone = run(); out.xCycles100ms = zc();
    var keep = JSON.stringify(state);
    state.osc[1] = { wave: 1, gain: 1, det: 0, mul: 2, div: 1, fm: false }; out.chordAdds = run();
    state.osc[1].fm = true; var fmRun = run(); out.fmPeak = fmRun.peak; out.fmChangesShape = zc() !== 22;
    state.fx.byp = { filter: false, bandpass: false, saturation: false, chorus: false }; state.fx.filterAmount = -0.4; state.fx.saturation = 60; state.fx.chorusVoices = 5;
    out.allFx = run();
    state = JSON.parse(keep);
    var lasso = PRESETS.filter(function (p) { return p.name === 'Lasso'; })[0];
    applyPreset(lasso); out.lasso = { osc0: state.osc[0], osc1: state.osc[1], masterTime: +state.masterTime.toFixed(4), hold: state.hold }; out.lassoRun = run();
    var anyFm = PRESETS.filter(function (p) { return p.osc.some(function (o) { return o.fm && o.wave; }); });
    applyPreset(anyFm[0]); syncUI(); out.fmPreset = anyFm[0].name;
    out.dottedDrops = routeSvg.innerHTML.split('stroke-dasharray:1 4').length - 1;
    var keepR = JSON.stringify(state.osc);
    out.fmCases = [[false, false], [true, false], [true, true], [false, true]].map(function (c) {
      state.osc.forEach(function (o, i) { if (i % 3) o.fm = false; }); state.osc[1].fm = c[0]; state.osc[2].fm = c[1]; drawRoutes();
      return (c[0] ? 'ring1' : '-') + '/' + (c[1] ? 'ring2' : '-') + ' live:' + [0, 1, 2].filter(function (i) { return !oscDead(i); }).map(function (i) { return i + 1; }).join(',') + ' dotted:' + (routeSvg.innerHTML.split('stroke-dasharray:1 4').length - 1);
    });
    state.osc = JSON.parse(keepR); drawRoutes();
    out.land = { knobs: document.querySelectorAll('[role="slider"]').length, buttons: document.querySelectorAll('button').length, W: GEO.W, H: GEO.H };
    ui.osc[1].g.g.click(); out.waveCycled = state.osc[1].wave;
    build('port', 1200); out.port = { knobs: document.querySelectorAll('[role="slider"]').length, buttons: document.querySelectorAll('button').length, W: GEO.W, H: GEO.H, dotted: routeSvg.innerHTML.split('stroke-dasharray:1 4').length - 1 };
    build(layoutKey, layoutH);
    out.errors = REPORT;
    document.getElementById('__report').textContent = JSON.stringify(out);
  })();
}
