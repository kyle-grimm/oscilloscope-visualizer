<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscilloscope Visualizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #242324; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; color: #ebebeb;
    font-family: 'Barlow Semi Condensed', 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #panel { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, #2b2a2d, #242324 48px); }
  button { outline: none; }
  button:focus-visible { box-shadow: 0 0 0 2px #cfabf6 !important; }
  .plist::-webkit-scrollbar { display: none; }
  .plist [data-i]:hover { color: #ffffff; }
  #tip { position: absolute; display: none; padding: 3px 7px; border-radius: 3px; background: #050406; border: 1px solid #515053; color: #cfabf6;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; pointer-events: none; z-index: 10; transform: translateX(-50%); }
</style>
</head>
<body>
<div id="stage"><div id="panel" aria-label="Loop panel"></div><div id="tip"></div></div>
<input id="fileIn" type="file" accept="audio/*" hidden>
<pre id="__report" hidden></pre>
<script>
'use strict';
/* L9 Loop prototype.
   Engine and controls follow the original Oscilloscope Visualizer (Documents/Code/oscilloscope-visualizer, script.js):
   X and Y channels, each a fundamental (wave, freq 20-500 Hz, phase, phase speed, gain) plus two chord layers chained
   fundamental -> Chord -> Chord 2 (wave, gain, detune, multiple / divide 1-13). A chord layer either adds into its channel
   or, with FM on (the ring between it and its mother), frequency-modulates its mother and leaves the mix.
   Effects: Filter -> Band Pass -> Saturation -> Chorus, each bypassable. Output: 0.2 gain, then the original's fatigue guard.
   Panel: osc 1-3 = X (left, red), osc 4-6 = Y (right, cyan). Two windows: Source & Display, Effects (with Master Time, Fast,
   Detune), plus the beam controls inside the Oscilloscope frame. The panel is 4:3 (L9 landscape, 1440 x 1080) or 3:4 (L9v portrait, 900 x 1200). */

  rec: '#f0484a', off: '#3d3b40', byp: '#3568b8', tabSub: '#333236', X: '#e5484d', Y: '#29c9e0', idle: '#77757b' };
var TAU = Math.PI * 2;
function clamp(v, a, b) { a = a == null ? 0 : a; b = b == null ? 1 : b; return v < a ? a : v > b ? b : v; }
var stage = document.getElementById('stage'), panel = document.getElementById('panel'), tip = document.getElementById('tip');
function el(tag, style, parent, text) {
  var e = document.createElement(tag);
  if (style) e.style.cssText = style;
  if (text != null) e.textContent = text;
  (parent || panel).appendChild(e);
  return e;
}
function at(x, y, w, h) { return 'position:absolute;left:' + x + 'px;top:' + y + 'px' + (w != null ? ';width:' + w + 'px' : '') + (h != null ? ';height:' + h + 'px' : ''); }
function PRINT(fs, col) { return 'font-size:' + fs + 'px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:' + (col || P.inkMute) + ';line-height:1;white-space:nowrap'; }

    return 'Neutral'; } },

  saturation: { min: 0, max: 100, def: 0, step: 1, f: function (v) { return v + '%'; } },
  chorusVoices: { min: 0, max: 7, def: 0, step: 1, f: function (v) { return v === 0 ? 'Off' : v + (v === 1 ? ' voice' : ' voices'); } }

function toV(d, x) {
  if (d.log) {
    if (d.logMid) return x <= d.logMid ? 0.5 * Math.log(x / d.min) / Math.log(d.logMid / d.min) : 0.5 + 0.5 * Math.log(x / d.logMid) / Math.log(d.max / d.logMid);
    return Math.log(x / d.min) / Math.log(d.max / d.min);
  }
  return clamp((x - d.min) / (d.max - d.min));
}
function fromV(d, v) {
  v = clamp(v);
  var x = d.log ? (d.logMid ? (v <= 0.5 ? d.min * Math.pow(d.logMid / d.min, v / 0.5) : d.logMid * Math.pow(d.max / d.logMid, (v - 0.5) / 0.5)) : d.min * Math.pow(d.max / d.min, v))
                : d.min + v * (d.max - d.min);
  if (d.step) x = +(Math.round(x / d.step) * d.step).toFixed(6);
  if (d.snapZero && Math.abs(x) < 0.03 * (d.max - d.min)) x = 0;
  return clamp(x, d.min, d.max);
}
var steps = function (d) { var n = d.step ? Math.round((d.max - d.min) / d.step) + 1 : 0; return n && n <= 61 ? n : 0; };

      state.osc[1].fm = !!c[0]; state.osc[2].fm = !!c[1]; c[2].forEach(function (w, i) { state.osc[i].wave = w; }); drawRoutes();
      var lit = routeLit();
      return (c[0] ? 'fm2' : '-') + '/' + (c[1] ? 'fm3' : '-') + ' waves ' + c[2].join('') + ' -> live:' + ([0, 1, 2].filter(function (i) { return lit[i]; }).map(function (i) { return i + 1; }).join(',') || 'none');
    });
    // Analyser resolution: width (semitones) of rows lit above 20% for a steady 0.5 sine, and the dip between 220 and 247 Hz.
    var B = 258, semi = B / (12 * Math.log2(SPEC_HI / SPEC_LO)), lvl = new Float32Array(400);
    var fill = function (fs) { for (var i = 0; i < E.SN; i++) { var v = 0; fs.forEach(function (f) { v += 0.5 * Math.sin(TAU * f * i / E.sr); }); E.sL[i] = v; } E.sw = 0; for (var j = 0; j < 3; j++) spectrum(SPEC[j], E.sL, SPEC[j].m[0]); return rowLevels(0, B, lvl); };
    var row = function (f) { return Math.floor(Math.log(f / SPEC_LO) / Math.log(SPEC_HI / SPEC_LO) * B); };
    out.anaWidth = [55, 110, 220, 440, 1760, 5000].map(function (f) { var v = fill([f]), n = 0; for (var b = 0; b < B; b++) if (v[b] > 0.2) n++; return f + 'Hz:' + (n / semi).toFixed(1); });
    var v2 = fill([220, 246.94]), a = row(220), z = row(246.94), lo = 1; for (var q = a + 1; q < z; q++) lo = Math.min(lo, v2[q]);
    out.anaDip220_247dB = Math.round((Math.min(v2[a], v2[z]) - lo) * SPEC_DB[1]);
    state.osc = JSON.parse(keepR); drawRoutes();
    out.land = { knobs: document.querySelectorAll('[role="slider"]').length, buttons: document.querySelectorAll('button').length, W: GEO.W, H: GEO.H };
    ui.osc[1].g.g.click(); out.waveCycled = state.osc[1].wave;
    build('port', 1200); out.port = { knobs: document.querySelectorAll('[role="slider"]').length, buttons: document.querySelectorAll('button').length, W: GEO.W, H: GEO.H, dotted: routeSvg.innerHTML.split('stroke-dasharray:1 4').length - 1 };
    build(layoutKey, layoutH);
    out.errors = REPORT;
    document.getElementById('__report').textContent = JSON.stringify(out);
  })();
}
